services:
  postgres:
    image: postgres:16-alpine
    container_name: medical-blog-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-medical}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-medical}
      POSTGRES_DB: ${POSTGRES_DB:-medical_blog}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - medical_blog_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  medical_blog_pgdata:
